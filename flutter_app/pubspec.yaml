name: soundpure
description: AI-powered audio enhancement – SoundPure

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File picking
  file_picker: ^8.0.3

  # HTTP client with progress
  dio: ^5.4.3

  # Audio playback
  just_audio: ^0.9.40

  # Path helpers
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # UI & animations
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1

  # File sharing / open
  share_plus: ^9.0.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
